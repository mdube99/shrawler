[tool.black]
line-length = 79
target-version = ['py311']
# 'extend-exclude' excludes files or directories in addition to the defaults
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
(
  ^/foo.py    # exclude a file named foo.py in the root of the project
  | .*_pb2.py  # exclude autogenerated Protocol Buffer files anywhere in the project
)
'''
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]
isort = { combine-as-imports = true, known-first-party = ["pydantic_ai"] }
mccabe = { max-complexity = 15 }
ignore = [
    "E501", # formatting is handled separately
    "B904", # preserve existing CLI exception behavior during package migration
]

[tool.pyright]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true
reportMissingTypeStubs = false
venvPath = ".venv"

[tool.mypy]
plugins = ['pydantic.mypy']

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "shrawler"
version = "1.0.0"
description = "SMB share enumeration, spidering, and evidence collection tool."
dependencies = [
    "impacket",
    "colorama",
    "python-dotenv",
    "requests",
    "tomli; python_version < '3.11'",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1",
]

[project.scripts]
shrawler = "shrawler.cli:main"

[tool.setuptools.packages.find]
include = ["shrawler*"]
